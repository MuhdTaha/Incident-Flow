services:
  # 1. Free Redis Instance (broker for Celery)
  - type: redis
    name: incidentflow-redis
    ipAllowList: []
    plan: free

  # 2. FastAPI web service
  - type: web
    name: incidentflow-api
    env: python
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: incidentflow-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_API_SECRET
        sync: false
      - key: MAILJET_SENDER_EMAIL
        sync: false
      - key: DEMO_ORG_ID
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_S3_ENDPOINT
        sync: false

  # 3. Celery worker (emails, SLA, demo refresh tasks)
  - type: worker
    name: incidentflow-worker
    env: python
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: incidentflow-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_API_SECRET
        sync: false
      - key: MAILJET_SENDER_EMAIL
        sync: false
      - key: DEMO_ORG_ID
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false

  # 4. Celery Beat (schedules SLA checks + demo refresh every 2h)
  - type: worker
    name: incidentflow-beat
    env: python
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery beat --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: incidentflow-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: DEMO_ORG_ID
        sync: false
